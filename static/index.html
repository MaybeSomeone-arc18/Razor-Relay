<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razor-Relay Zero-Trust Gateway</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        syne: ['Syne', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: '#05050A',
                        cardBg: 'rgba(13, 14, 22, 0.6)',
                        cardBorder: 'rgba(255, 255, 255, 0.07)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #030305 0%, #08080E 100%);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* Ambient Mesh Glows */
        .ambient-glow-left {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(0,255,136,0.08) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .ambient-glow-right {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(255,42,109,0.06) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--tw-colors-cardBg);
            border: 1px solid var(--tw-colors-cardBorder);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .hover-emerald:hover { border-color: rgba(0, 255, 136, 0.3); }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px #00FF88;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Inputs */
        .input-dark {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }
        .input-dark:focus {
            outline: none;
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Badges */
        .status-badge {
            transition: all 0.3s ease;
            box-shadow: 0 0 20px currentColor;
        }
        .badge-closed { color: #00FF88; border-color: #00FF88; text-shadow: 0 0 10px #00FF88; }
        .badge-half-open { color: #FFB800; border-color: #FFB800; text-shadow: 0 0 10px #FFB800; }
        .badge-open { color: #FF2A6D; border-color: #FF2A6D; text-shadow: 0 0 10px #FF2A6D; }

        /* Log Entry Colors */
        .log-success { color: #00FF88; }
        .log-error { color: #FF2A6D; }
        .log-info { color: #FFB800; }
        .log-pre { color: #A0A0A0; }
        .log-key { color: #4DEEEA; }
        .log-string { color: #00FF88; }
        .log-number { color: #FFB800; }
    </style>
</head>
<body class="flex flex-col h-screen antialiased">
    <div class="ambient-glow-left"></div>
    <div class="ambient-glow-right"></div>

    <!-- Top Hero Status Bar -->
    <header class="glass-card border-x-0 border-t-0 border-b flex justify-between items-center px-8 py-4 shrink-0">
        <div>
            <h1 class="font-syne text-2xl tracking-[0.2em] font-bold text-white uppercase m-0 leading-tight">Razor-Relay <span class="text-white/30">//</span></h1>
            <div class="text-white/50 text-xs font-mono tracking-widest uppercase mt-1">Zero-Trust Gateway Infrastructure</div>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-white/40 text-xs font-mono uppercase tracking-widest">Circuit Status</span>
            <div id="circuit-badge" class="status-badge badge-closed border px-4 py-1.5 rounded-full font-mono text-sm font-bold tracking-widest uppercase">
                CLOSED
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- Left Column: Controls -->
        <div class="w-[45%] p-8 overflow-y-auto z-10 flex flex-col gap-6">
            
            <!-- Inject Switch Chaos -->
            <div class="glass-card rounded-2xl p-6 hover-emerald">
                <h3 class="font-syne text-lg font-bold uppercase tracking-wider mb-2">Inject Switch Chaos</h3>
                <p class="text-white/50 text-sm mb-6">Manipulate telemetry to observe circuit breaker failover dynamics.</p>
                
                <div class="mb-5">
                    <div class="flex justify-between mb-2">
                        <label class="text-xs uppercase tracking-widest text-white/60 font-semibold">Latency (ms)</label>
                        <div class="text-xs font-mono text-white/80" id="latency-val">50 ms</div>
                    </div>
                    <input type="range" id="chaos-latency" min="0" max="1000" value="50" oninput="updateSlider('latency-val', this.value, ' ms')">
                </div>

                <div class="mb-8">
                    <div class="flex justify-between mb-2">
                        <label class="text-xs uppercase tracking-widest text-white/60 font-semibold">Rolling Error Rate</label>
                        <div class="text-xs font-mono text-white/80" id="error-val">0.0</div>
                    </div>
                    <input type="range" id="chaos-error" min="0" max="1" step="0.01" value="0.0" oninput="updateSlider('error-val', this.value, '')">
                </div>

                <button onclick="injectChaos()" class="w-full py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-syne tracking-[0.15em] uppercase transition-all duration-300 hover:border-emerald-500/50 hover:shadow-[0_0_15px_rgba(0,255,136,0.2)]">
                    Apply Telemetry
                </button>
            </div>

            <!-- Simulate Agent Purchase -->
            <div class="glass-card rounded-2xl p-6 hover-emerald">
                <h3 class="font-syne text-lg font-bold uppercase tracking-wider mb-6">Simulate Agent Purchase</h3>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="text-xs uppercase tracking-widest text-white/60 font-semibold mb-2 block">Mandate ID</label>
                        <input type="text" id="sim-mandate-id" value="agent_tx_999" class="input-dark w-full px-4 py-2.5 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="text-xs uppercase tracking-widest text-white/60 font-semibold mb-2 block">Requested Amount (₹)</label>
                        <input type="number" id="sim-amount" value="500" class="input-dark w-full px-4 py-2.5 rounded-lg text-sm">
                    </div>
                </div>
                <button onclick="simulatePurchase()" class="w-full py-3 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 rounded-lg text-xs font-syne tracking-[0.15em] uppercase transition-all duration-300 hover:shadow-[0_0_15px_rgba(0,255,136,0.3)]">
                    Dispatch UAP Payload
                </button>
            </div>

            <!-- Bottom Split -->
            <div class="grid grid-cols-2 gap-6">
                <!-- Revocation -->
                <div class="glass-card rounded-2xl p-6 hover:border-rose-500/30 hover:-translate-y-1 transition-all duration-300">
                    <h3 class="font-syne text-md font-bold uppercase tracking-wider mb-4">Instant Revocation</h3>
                    <label class="text-xs uppercase tracking-widest text-white/60 font-semibold mb-2 block">Mandate ID</label>
                    <input type="text" id="revoke-mandate-id" value="agent_tx_999" class="input-dark w-full px-4 py-2.5 rounded-lg text-sm mb-4">
                    <button onclick="revokeMandate()" class="w-full py-2.5 bg-rose-500/5 hover:bg-rose-950/40 border border-rose-500/30 text-rose-400 rounded-lg text-xs font-syne tracking-[0.15em] uppercase transition-all duration-300">
                        Revoke Mandate
                    </button>
                </div>
                
                <!-- Escrow -->
                <div class="glass-card rounded-2xl p-6 hover:border-emerald-500/30 hover:-translate-y-1 transition-all duration-300">
                    <h3 class="font-syne text-md font-bold uppercase tracking-wider mb-4">Execute Escrow</h3>
                    <label class="text-xs uppercase tracking-widest text-white/60 font-semibold mb-2 block">Completion Score</label>
                    <input type="number" id="escrow-score" value="0.95" step="0.01" class="input-dark w-full px-4 py-2.5 rounded-lg text-sm mb-4">
                    <button onclick="settleEscrow()" class="w-full py-2.5 bg-emerald-500/5 hover:bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 rounded-lg text-xs font-syne tracking-[0.15em] uppercase transition-all duration-300">
                        Settle Funds
                    </button>
                </div>
            </div>

        </div>

        <!-- Right Column: Terminal -->
        <div class="w-[55%] p-8 pl-0 z-10 flex flex-col">
            <div class="glass-card rounded-2xl flex-1 flex flex-col overflow-hidden bg-[#020202]/80 border-white/5 shadow-2xl">
                <!-- Window Bar -->
                <div class="px-4 py-3 border-b border-white/5 flex justify-between items-center bg-white/5">
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-rose-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-amber-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
                    </div>
                    <div class="text-xs font-mono text-white/30 uppercase tracking-widest">Audit_Trail_Terminal</div>
                    <button onclick="clearLogs()" class="text-xs font-mono text-white/40 hover:text-white uppercase tracking-widest transition-colors">Clear</button>
                </div>
                
                <!-- Logs Area -->
                <div class="p-6 overflow-y-auto flex-1 font-mono text-sm flex flex-col-reverse" id="log-container">
                    <!-- Logs will be injected here -->
                </div>
            </div>
        </div>

    </main>

<script>
    function updateSlider(id, val, suffix) {
        document.getElementById(id).innerText = val + suffix;
    }

    // A simple syntax highlighter for JSON
    function syntaxHighlight(json) {
        if (typeof json != 'string') {
             json = JSON.stringify(json, undefined, 2);
        }
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            let cls = 'log-number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) {
                    cls = 'log-key';
                } else {
                    cls = 'log-string';
                }
            } else if (/true|false/.test(match)) {
                cls = 'log-number';
            } else if (/null/.test(match)) {
                cls = 'log-number';
            }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    function addLog(action, type, data) {
        const container = document.getElementById('log-container');
        const entry = document.createElement('div');
        entry.className = 'mb-6 pb-6 border-b border-white/5 last:border-0 break-words';
        
        const timestamp = new Date().toISOString().split('T')[1].slice(0, -1);
        let colorClass = 'log-info';
        if (type === 'success' || action.includes('APPROVED')) colorClass = 'log-success';
        if (type === 'error' || action.includes('REJECTED') || action.includes('ERROR')) colorClass = 'log-error';
        
        const formattedData = syntaxHighlight(data);

        entry.innerHTML = `
            <div class="mb-3 flex items-center gap-3">
                <span class="text-white/30 text-xs">[${timestamp}]</span>
                <span class="${colorClass} font-bold text-xs tracking-widest uppercase">[${action}]</span>
            </div>
            <pre class="log-pre bg-white/[0.02] p-4 rounded-lg border border-white/5 text-xs overflow-x-auto">${formattedData}</pre>
        `;
        
        container.prepend(entry);
    }

    function updateBadge(state) {
        const badge = document.getElementById('circuit-badge');
        badge.innerText = state;
        badge.className = 'status-badge border px-4 py-1.5 rounded-full font-mono text-sm font-bold tracking-widest uppercase';
        if (state === 'CLOSED') badge.classList.add('badge-closed');
        else if (state === 'HALF_OPEN') badge.classList.add('badge-half-open');
        else badge.classList.add('badge-open');
    }

    async function injectChaos() {
        const latency = parseFloat(document.getElementById('chaos-latency').value);
        const error = parseFloat(document.getElementById('chaos-error').value);
        
        try {
            const res = await fetch('/v1/relay/chaos/inject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latency_ms: latency, rolling_error_rate: error })
            });
            const data = await res.json();
            addLog('CHAOS_INJECT', 'info', data);
            if (data.circuit_state) updateBadge(data.circuit_state);
        } catch (e) {
            addLog('CHAOS_ERROR', 'error', { error: e.message });
        }
    }

    async function simulatePurchase() {
        const mandateId = document.getElementById('sim-mandate-id').value;
        const amount = parseFloat(document.getElementById('sim-amount').value);
        const nonce = crypto.randomUUID();
        
        const payload = {
            mandate_id: mandateId,
            delegation: {
                human_root_hash: "ui_hash",
                primary_agent_id: "ui_agent",
                sub_agent_id: null,
                delegation_depth: 1
            },
            limits: {
                per_transaction_cap: 2000.0,
                daily_cap: 10000.0,
                price_slippage_percent: 5.0
            },
            scope: "dashboard_sim",
            expiry: Math.floor(Date.now() / 1000) + 3600,
            nonce: nonce,
            requested_amount: amount,
            quoted_price: amount,
            signature: "ui_signature" 
        };

        try {
            const res = await fetch('/v1/relay/gateway/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (res.ok) {
                addLog('GATEWAY_APPROVED', 'success', data);
                if (data.routing_state) updateBadge(data.routing_state);
            } else {
                addLog('GATEWAY_REJECTED', 'error', data);
            }
        } catch (e) {
            addLog('GATEWAY_ERROR', 'error', { error: e.message });
        }
    }

    async function revokeMandate() {
        const mandateId = document.getElementById('revoke-mandate-id').value;
        try {
            const res = await fetch(`/v1/relay/mandate/revoke?mandate_id=${encodeURIComponent(mandateId)}`, {
                method: 'POST'
            });
            const data = await res.json();
            addLog('REVOKE_MANDATE', 'info', data);
        } catch (e) {
            addLog('REVOKE_ERROR', 'error', { error: e.message });
        }
    }

    async function settleEscrow() {
        const mandateId = document.getElementById('revoke-mandate-id').value;
        const score = parseFloat(document.getElementById('escrow-score').value);
        
        const payload = {
            mandate_id: mandateId,
            verification: { completion_score: score },
            amount_in_escrow: parseFloat(document.getElementById('sim-amount').value) || 500.0
        };

        try {
            const res = await fetch('/v1/relay/escrow/settle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                addLog('ESCROW_SETTLEMENT', 'success', data);
            } else {
                addLog('ESCROW_REJECTED', 'error', data);
            }
        } catch (e) {
            addLog('ESCROW_ERROR', 'error', { error: e.message });
        }
    }

    function clearLogs() {
        document.getElementById('log-container').innerHTML = '';
    }
</script>
</body>
</html>
